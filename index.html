<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          /* Targets the un-media'd tag below by id, not by name. There are
             three theme-color tags now — the two media-scoped ones let the
             browser pick correctly before this script runs, and this one is
             the override the in-app toggle drives. Selecting on
             meta[name=theme-color] would match whichever came first. */
          var meta = document.getElementById('theme-color')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#101114' : '#FBFBFA')
        } catch (e) {
          /* localStorage unavailable — falls back to OS preference */
        }
      })()
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101114" />
    <meta id="theme-color" name="theme-color" content="#FBFBFA" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    />
    <!--
      The terms people actually search when they are looking for this and don't
      know it exists: they search for the *problem* ("how to type nepali in
      english"), for the tool they were taught ("preeti", "romanized nepali"),
      or for the script. Search engines weight this tag at roughly nothing on
      its own — it is here for the site-search and share surfaces that still
      read it, and the same vocabulary is carried by the title, description and
      OG tags, which are what actually rank.
    -->
    <meta
      name="keywords"
      content="nepali typing, type nepali online, romanized nepali, nepali unicode, devanagari keyboard, english to nepali typing, preeti alternative, nepali transliteration, nepali OCR, nepali translation, नेपाली टाइपिङ, देवनागरी, offline nepali keyboard"
    />
    <link rel="canonical" href="https://lekh-gamma.vercel.app/" />

    <!-- Share cards. No og:image: there is no social card asset in public/,
         and pointing at one that does not exist gives a broken preview rather
         than the plain text card you get from omitting it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lekh" />
    <meta property="og:url" content="https://lekh-gamma.vercel.app/" />
