<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!-- Exactly one theme-color tag, and it is above the script on purpose.
         There were briefly three: this one plus a
         media="(prefers-color-scheme: light)" / dark pair. That could not work.
         The two media-scoped tags are exhaustive between them, so the UA always
         had one of *those* active and this override could never be selected no
         matter who wrote to it — and the script below ran before line 30 was
         parsed, so its getElementById returned null and it silently did nothing
         on every load. One tag that the script and the in-app toggle both own
         is the only arrangement where the phone status bar follows the theme. -->
    <meta id="theme-color" name="theme-color" content="#FAFAFB" />
    <script>
      (function () {
        /* Narrow guard: only the storage read can throw (private mode, blocked
           cookies), and a throw there must not cost us the OS-preference
           fallback as well — that used to take the whole block down and leave
           a dark-mode phone painting the light colour. */
        var stored = null
        try {
          stored = localStorage.getItem('theme')
        } catch (e) {}
        try {
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          /* Kept in sync with applyTheme() in src/lib/theme.ts — same id, same
             two colours, which must match --bg per theme in index.css. */
          var meta = document.getElementById('theme-color')
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0E1220' : '#FAFAFB')
        } catch (e) {}
      })()
    </script>
