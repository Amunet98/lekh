apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/* Signing config comes from keystore.properties, which is gitignored and
 * points at a keystore kept outside the repo. Absent it, release builds are
 * simply unsigned rather than failing — so a fresh clone can still run
 * assembleDebug without any secrets. */
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

/* One version number for the whole app, not two kept in sync by hand — see
 * package.json's version, bumped on every change per CLAUDE.md. versionCode
 * still has to be its own thing: Play requires a plain ever-increasing
 * integer, not a semver string. Deriving it from the same version
 * (major*1_000_000 + minor*1_000 + patch) means it never needs separate
 * upkeep either, as long as no version component ever reaches 1000 — true
 * for any version this app will realistically reach. */
def packageJsonText = rootProject.file("../package.json").text
def versionMatch = (packageJsonText =~ /"version"\s*:\s*"([^"]+)"/)
if (!versionMatch.find()) {
    throw new GradleException("Could not read \"version\" from package.json")
}
def appVersionName = versionMatch.group(1)
def (vMajor, vMinor, vPatch) = appVersionName.split('\\.').collect { it as int }
def appVersionCode = vMajor * 1_000_000 + vMinor * 1_000 + vPatch

android {
    namespace = "np.com.bimeshpoudel.lekh"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "np.com.bimeshpoudel.lekh"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            release {
                storeFile file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!keystoreProps.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Matches capacitor.build.gradle (Capacitor-managed, applied below) —
    // that file hardcodes 21 and is regenerated on every `cap update`, so
    // this has to track it rather than the other way around.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
