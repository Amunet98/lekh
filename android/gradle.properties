org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
# AGP 8.7.2 predates official compileSdk/targetSdk 36 (Android 16) support.
# The build has been verified working on Android 16, but AGP still warns/
# errors on an SDK level ahead of what it was tested against; this is
# Google's documented escape hatch rather than a real compatibility problem.
android.suppressUnsupportedCompileSdk=36
