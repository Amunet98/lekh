<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Manifest shortcut icons — the things Android draws when you long-press
         the installed app. Rendered one per load, selected by location.hash;
         see scripts/render-shortcut-icons.mjs.

         Palette follows the app icon rather than the CSS tokens, so the
         shortcut sheet looks like it belongs to the same app: tile #151A2B
         (the dark surface), marks #EEEFF0, and the crimson #F87171 that draws
         the typing cursor. Crimson and not the flag's #C8102E: these tiles are
         always on the dark surface, where the flag red goes muddy — same
         reasoning as --dark-accent in src/index.css.

         Full-bleed square, no rounding of our own — launchers apply their own
         mask, and pre-rounding it just puts a dark corner inside their shape. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 192px; height: 192px; overflow: hidden; }
      body { background: #151a2b; display: grid; place-items: center; }

      .icon { display: none; }
      body:not(:has(#type:target)):not(:has(#upload:target)):not(:has(#translate:target)) #type { display: block; }
      .icon:target { display: block; }

      svg { display: block; width: 116px; height: 116px; }
      .stroke {
        fill: none;
        stroke: #eeeff0;
        /* Units of the 24-box, so this scales with the viewBox: 2.1 renders at
           ~10px on a 116px icon.
         *
         * Explicitly NO vector-effect: non-scaling-stroke — that pins the
         * stroke to N *device* pixels regardless of the viewBox, which drew
         * these as 1.9px hairlines on a 192px tile and would have been
         * sub-pixel by the time Android shrank them to 24dp. */
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* One crimson element per icon, echoing the cursor bar in the app icon —
         enough to read as the same family without competing with the shape. */
      .accent { stroke: #f87171; }
    </style>
  </head>
  <body>
    <!-- Same three marks as the in-app tab bar (src/components/TabSwitcher.tsx).
         Deliberately not new drawings: the tab bar is where people already
         learned what these three sections look like. -->

    <div class="icon" id="type">
      <svg viewBox="0 0 24 24">
        <path class="stroke accent" d="M12 20h9" />
        <path class="stroke" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
    </div>

    <div class="icon" id="upload">
      <svg viewBox="0 0 24 24">
        <path class="stroke accent" d="M12 15V4" />
        <path class="stroke accent" d="M7.5 8.5 12 4l4.5 4.5" />
        <path class="stroke" d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
      </svg>
    </div>

    <div class="icon" id="translate">
      <svg viewBox="0 0 24 24">
        <path class="stroke" d="M4 7h9M4 7l3-3M4 7l3 3" />
        <path class="stroke accent" d="M20 17h-9M20 17l-3-3M20 17l-3 3" />
      </svg>
    </div>
  </body>
</html>
