<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;700;800&family=Inter:wght@500;600;700&family=Noto+Sans+Devanagari:wght@600;700&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      /* Play Store feature graphic, 1024x500 exactly.

         Drawn in the same language as the phone screenshots
         (store-screenshots.html): the flag-crimson ground of slide 1, and real
         captures from design/play/raw/ in the same phone frame. The two sets
         sit next to each other on the listing, so they have to read as one.

         Play crops and overlays this graphic differently across surfaces — on
         some the app icon and title sit on the lower-left — so everything
         load-bearing is in the upper two-thirds on the left, and the phones on
         the right are decoration that can lose their edges.

         No Latin "LEKH PATRO" under the wordmark: the listing title already
         says it, and the same name in two scripts reads as a stutter. */
      :root {
        --crimson: #c8102e;
        --dev: 'Anek Devanagari', 'Noto Sans Devanagari', sans-serif;
        --dev-text: 'Noto Sans Devanagari', sans-serif;
        --en: 'Inter', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1024px; height: 500px; overflow: hidden; }
      body {
        position: relative;
        background: var(--crimson);
        color: #fff;
        font-family: var(--en);
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: '';
        position: absolute;
        left: -220px;
        top: -330px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.17), transparent 62%);
      }
      body::after {
        content: '';
        position: absolute;
        right: -200px;
        bottom: -420px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(11, 58, 140, 0.55), transparent 62%);
      }

      .copy { position: absolute; left: 64px; top: 66px; z-index: 2; }
      .mark {
        font-family: var(--dev);
        font-weight: 800;
        font-size: 112px;
        line-height: 1;
        letter-spacing: -0.005em;
      }
      .mark .slash { color: rgba(255, 255, 255, 0.45); font-weight: 500; margin: 0 0.03em; }
      .mark em { font-style: normal; color: #ffd4da; }

      .demo {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        margin-top: 30px;
        padding: 14px 26px;
        border-radius: 999px;
        background: #fff;
        color: #141824;
        box-shadow: 0 18px 36px -14px rgba(60, 0, 10, 0.5);
      }
      .demo .roman { font-family: var(--mono); font-size: 26px; color: #646c7e; }
      .demo .arrow { font-size: 24px; color: var(--crimson); font-weight: 700; }
      .demo .deva { font-family: var(--dev-text); font-weight: 700; font-size: 31px; }

      .line {
        margin-top: 24px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.005em;
        color: rgba(255, 255, 255, 0.92);
      }
      .line span { color: rgba(255, 255, 255, 0.5); margin: 0 10px; }

      .phone {
        position: absolute;
        width: 232px;
        padding: 7px;
        border-radius: 34px;
        background: #0a0a0d;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 30px 50px -16px rgba(40, 0, 8, 0.55);
        z-index: 1;
      }
      .phone img { display: block; width: 100%; border-radius: 27px; }
      .phone::after {
        content: '';
        position: absolute;
        top: 15px;
        left: 50%;
        width: 11px;
        height: 11px;
        margin-left: -5.5px;
        border-radius: 50%;
        background: #050507;
      }
      .p1 { left: 604px; top: 58px; transform: rotate(-7deg); }
      .p2 { left: 790px; top: 96px; transform: rotate(6deg); }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="mark">लेख<span class="slash">/</span><em>पात्रो</em></div>
      <div class="demo">
        <span class="roman">kasto chha</span><span class="arrow">&rarr;</span><span class="deva">कस्तो छ</span>
      </div>
      <div class="line">Type<span>·</span>Patro<span>·</span>Translate</div>
    </div>
    <div class="phone p1"><img src="play/raw/type.png" alt="" /></div>
    <div class="phone p2"><img src="play/raw/patro-dark.png" alt="" /></div>
  </body>
</html>
